[build]
  functions = "netlify/functions"
  publish = "Public"

[dev]
  publish = "Public"

# Route aliases must load the app shell (index.html).
# Admin and store views are partials rendered by main.js inside #content-area.
[[redirects]]
  from = "/admin/tracking"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/catalog"
  to = "/index.html"
  status = 200

[[redirects]]
