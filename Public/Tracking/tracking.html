<div class="container">
    <div class="card">
        <i class="fa fa-truck" style="font-size: 3rem; color: var(--pink-accent);"></i>
        <h3>Rastreo de Paquetes</h3>
        <p>Ingresa tu número de tracking para verificar el estado en el casillero.</p>
        
        <div style="margin-top: 1rem;">
            <input type="text" id="trackingNum" placeholder="Ej: 1Z99912349..." style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--pink-light); box-sizing: border-box;">
            <button onclick="buscarTracking()" style="margin-top:1rem; width:100%; padding:12px; background:var(--pink-accent); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Buscar Paquete</button>
        </div>

        <!-- Espacio para mostrar el resultado -->
        <div id="resultadoRastreo" style="display:none; margin-top: 1.5rem; text-align: center;">
            <!-- Mantenemos este div para mensajes de estado como "Buscando..." o errores -->
            <div id="infoDetalle"></div>

            <!-- Plantilla para los resultados (oculta por defecto) -->
            <div id="trackingTemplate" style="display: none;">
                <div class="tracking-info-box">
                    <div class="tracking-info-estado-wrap">
                        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px;">
                            <span class="tracking-estado-badge" style="margin: 0;" data-field="ultimoEstado"></span>
                        </div>
                    </div>
                    <div class="tracking-info-rows">
                        <!-- Las filas de información se insertarán aquí dinámicamente -->
                    </div>
                </div>

                <div class="tracking-table-wrapper" style="display: none;">
                    <table class="tracking-table">
                        <thead>
                            <tr><th>Estado</th><th>Fecha</th></tr>
                        </thead>
                        <tbody>
                            <!-- Las filas del historial se insertarán aquí dinámicamente -->
                        </tbody>
                    </table>
                </div>

                <a href="#" target="_blank" class="btn-whatsapp-track" data-field="whatsappLink">
                    <i class="fab fa-whatsapp"></i> Consultar por WhatsApp
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Plantilla para una fila del historial (totalmente invisible y reutilizable) -->
<template id="historialRowTemplate">
    <tr>
        <td data-field="detalleEstado"></td>
        <td data-field="fecha"></td>
    </tr>
</template>
